---
image: cincproject/omnibus-debian

stages:
  - patch
  - package
  - scan
  - test
  - cleanup
  - deploy
  - publish

variables:
  ORIGIN: https://github.com/chef/chef.git
  REF: main
  CHANNEL: unstable
  CINC_PRODUCT: cinc
  OMNIBUS_FIPS_MODE: "true"
  OMNIBUS_LOG_LEVEL: "info"
  # cincproject/omnibus-windows tag. Always dated, never :ltsc2022: it is in
  # the Windows cache key, so a new toolchain never reuses the old git cache.
  BUILDER_IMAGE_TAG: "ltsc2022-20261020-1851"

workflow:
  rules:
    # Run if we trigger a pipeline from the web
    - if: $CI_PIPELINE_SOURCE == "web"
    # Run if we trigger a pipeline from another project (i.e. upstream/chef)
    - if: $CI_PIPELINE_SOURCE == "pipeline"
    # Run if this is a merge request
    - if: $CI_MERGE_REQUEST_ID

include:
  - local: .gitlab/package.yml
  - local: .gitlab/test.yml
  # CVE scanning. Provides the hidden .security:build-scan base used by the
  # security:build-scan:* jobs below to grype-scan a freshly-built package.
  # The dependency/omnitruck/container scanners it also defines are schedule-only
  # and stay dormant here. grype waivers live in .grype.yaml.
  - component: gitlab.com/cinc-project/ci-tools/security-scan@main
    inputs:
      image: cincproject/omnibus-debian:13
      dep_stage: scan
      image_stage: scan
      build_scan_stage: scan
      ci_tools_repo: https://gitlab.com/cinc-project/ci-tools.git
      ci_tools_ref: main

patch:
  stage: patch
  tags:
    - docker-x86_64
  script:
    - ./patch.sh
  artifacts:
    expire_in: 1mo
    paths:
      - chef/

# Package stage

package:debian-13:riscv64:
  extends: .package:debian
  image:
    name: cincproject/omnibus-debian:13
    docker:
      platform: linux/riscv64
  cache:
    key: trial-emu-debian-13
  tags:
    - docker-x86_64-riscv64
  variables:
    PLATFORM_VER: "13"
    OMNIBUS_FIPS_MODE: "false"
    OMNIBUS_SHELLOUT_TIMEOUT: "21600"
    OMNIBUS_WORKERS: "28"

package:ubuntu-24.04:riscv64:
  extends: .package:ubuntu
  image:
    name: cincproject/omnibus-ubuntu:24.04
    docker:
      platform: linux/riscv64
  cache:
    key: trial-emu-ubuntu-24.04
  tags:
    - docker-x86_64-riscv64
  variables:
    PLATFORM_VER: "24.04"
    OMNIBUS_FIPS_MODE: "false"
    OMNIBUS_SHELLOUT_TIMEOUT: "21600"
    OMNIBUS_WORKERS: "28"

test:debian-13:riscv64:
  extends: .test:debian
  image: cincproject/omnibus-debian:13
  needs:
    - package:debian-13:riscv64
  tags:
    - docker-riscv64
  variables:
    PLATFORM_VER: "13"
    OMNIBUS_FIPS_MODE: "false"

test:ubuntu-24.04:riscv64:
  extends: .test:ubuntu
  image: cincproject/omnibus-ubuntu:24.04
  needs:
    - package:ubuntu-24.04:riscv64
  tags:
    - docker-riscv64
  variables:
    PLATFORM_VER: "24.04"
    OMNIBUS_FIPS_MODE: "false"

.ssh-setup:
  before_script:
    - eval $(ssh-agent -s)
    - echo "${SSH_PRIVATE_KEY}" | tr -d '\r' | ssh-add - > /dev/null
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts

.cleanup:
  stage: cleanup
  dependencies: []
  variables:
    GIT_CHECKOUT: "false"
  when: always
  script:
    - sudo rm -rf chef/
    - sudo rm -rf ${CI_PROJECT_DIR}/cinc-project/distribution/client/

package:debian-13:riscv64:native:
  extends: .package:debian
  image: cincproject/omnibus-debian:13
  cache:
    key: trial-nat-debian-13
  tags:
    - docker-riscv64
  variables:
    PLATFORM_VER: "13"
    OMNIBUS_FIPS_MODE: "false"

package:ubuntu-24.04:riscv64:native:
  extends: .package:ubuntu
  image: cincproject/omnibus-ubuntu:24.04
  cache:
    key: trial-nat-ubuntu-24.04
  tags:
    - docker-riscv64
  variables:
    PLATFORM_VER: "24.04"
    OMNIBUS_FIPS_MODE: "false"

trial:x86-check:debian-13:
  stage: scan
  image: cincproject/omnibus-debian:13
  needs:
    - job: package:debian-13:riscv64
      artifacts: false
  when: always
  tags:
    - docker-x86_64-riscv64
  script:
    - uname -m
    - '[ "$(uname -m)" = x86_64 ]'

trial:x86-check:ubuntu-24.04:
  stage: scan
  image: cincproject/omnibus-ubuntu:24.04
  needs:
    - job: package:ubuntu-24.04:riscv64
      artifacts: false
  when: always
  tags:
    - docker-x86_64-riscv64
  script:
    - uname -m
    - '[ "$(uname -m)" = x86_64 ]'
