# Grype waivers for the cinc-client CVE scans. Grype auto-loads this file from
# the repo root (used by the security:build-scan:* CI jobs and local runs).
#
# Policy: prefer fixing or purging a finding over waiving it. Waive only findings
# that are inert (superseded at runtime) or accepted-risk, keep a one-line reason
# and a review date on each, and re-review periodically so waivers don't rot.
ignore:
  # --- nokogiri 1.18.10 (Client 18 stays on Ruby 3.1) ---------------------
  # chef-18 pins 1.18.10, the last 1.18 release; every fixed release (1.19.1+)
  # needs Ruby >= 3.2. Nothing shipped reaches these: chef never loads
  # nokogiri, nori and aws-sdk-core use only its SAX parser, and inspec's JUnit
  # reporter uses REXML. It ships as a library for cookbook code, which already
  # runs as root. Drop these when Client 18 moves to Ruby >= 3.2 or reaches
  # EOL. (reviewed 2026-10-16)
  # JRuby only; CRuby's libxml2 already blocks network schemes
  - vulnerability: GHSA-8678-w3jw-xfc2
    package:
      name: nokogiri
      version: "1.18.10"
      type: gem
  # needs code to call .allocate on a native-backed class
  - vulnerability: GHSA-9cv2-cfxc-v4v2
    package:
      name: nokogiri
      version: "1.18.10"
      type: gem
  # needs code to set a DTD node as Document#root
  - vulnerability: GHSA-wjv4-x9w8-wm3h
    package:
      name: nokogiri
      version: "1.18.10"
      type: gem
  # needs a hand-built XPathContext to outlive its document
  - vulnerability: GHSA-p67v-3w7g-wjg7
    package:
      name: nokogiri
      version: "1.18.10"
      type: gem
  # needs code to rescue a bad Document#encoding= and reuse it
  - vulnerability: GHSA-5v8h-3h3q-446p
    package:
      name: nokogiri
      version: "1.18.10"
      type: gem
  # needs Attr#value= after code took a ref to its child
  - vulnerability: GHSA-phwj-rprq-35pp
    package:
      name: nokogiri
      version: "1.18.10"
      type: gem
  # needs do_xinclude after code took refs to include nodes
  - vulnerability: GHSA-wfpw-mmfh-qq69
    package:
      name: nokogiri
      version: "1.18.10"
      type: gem
  # CSS selector ReDoS; needs attacker-written selectors
  - vulnerability: GHSA-c4rq-3m3g-8wgx
    package:
      name: nokogiri
      version: "1.18.10"
      type: gem
  # XSLT param leak; needs attacker-controlled transform params
  - vulnerability: GHSA-v2fc-qm4h-8hqv
    package:
      name: nokogiri
      version: "1.18.10"
      type: gem
  # canonicalize; needs SAML-style signature checks
  - vulnerability: GHSA-wx95-c6cv-8532
    package:
      name: nokogiri
      version: "1.18.10"
      type: gem
  # NodeSet#[]; needs an attacker-controlled index
  - vulnerability: GHSA-5prr-v3j2-97mh
    package:
      name: nokogiri
      version: "1.18.10"
      type: gem
  # --- Ruby 3.1.7 and OpenSSL 3.5.9 security backports (CVE-2026-132825 and others) ---
  # omnibus-software applies backports of ten Ruby fixes to 3.1.7 and nine OpenSSL
  # fixes to 3.5.9, but grype matches the unchanged version strings. Each waiver is
  # scoped to its package at that exact version, so another build still reports
  # them. CVE-2026-95690, 84786 and 107494 are not waived. (reviewed 2026-11-21)
  - vulnerability: GHSA-34m4-m9fh-gqp5
    package: { name: ruby, version: "3.1.7p261" }
  - vulnerability: GHSA-87fm-7w84-j2px
    package: { name: ruby, version: "3.1.7p261" }
  - vulnerability: GHSA-3p8q-wmhx-vm2w
    package: { name: ruby, version: "3.1.7p261" }
  - vulnerability: GHSA-7x2q-68qv-6p8x
    package: { name: ruby, version: "3.1.7p261" }
  - vulnerability: GHSA-wpqw-5qxg-m68r
    package: { name: ruby, version: "3.1.7p261" }
  - vulnerability: GHSA-7whj-cfh7-xgm4
    package: { name: ruby, version: "3.1.7p261" }
  - vulnerability: GHSA-pvgc-g7gj-pv6h
    package: { name: ruby, version: "3.1.7p261" }
  - vulnerability: GHSA-qm4g-8pfh-6996
    package: { name: ruby, version: "3.1.7p261" }
  - vulnerability: GHSA-22mf-ggw7-pxfx
    package: { name: ruby, version: "3.1.7p261" }
  - vulnerability: GHSA-gfj3-8wj9-qx8p
    package: { name: ruby, version: "3.1.7p261" }
  - vulnerability: CVE-2026-132825
    package: { name: ruby, version: "3.1.7p261" }
  - vulnerability: CVE-2026-88822
    package: { name: openssl, version: "3.5.9" }
  - vulnerability: CVE-2026-88823
    package: { name: openssl, version: "3.5.9" }
  - vulnerability: CVE-2026-95691
    package: { name: openssl, version: "3.5.9" }
  - vulnerability: CVE-2026-95692
    package: { name: openssl, version: "3.5.9" }
  - vulnerability: CVE-2026-107496
    package: { name: openssl, version: "3.5.9" }
  - vulnerability: CVE-2026-35190
    package: { name: openssl, version: "3.5.9" }
  - vulnerability: CVE-2026-107493
    package: { name: openssl, version: "3.5.9" }
  - vulnerability: CVE-2026-124709
    package: { name: openssl, version: "3.5.9" }
  - vulnerability: CVE-2026-121482
    package: { name: openssl, version: "3.5.9" }
  # erb 2.2.3 and zlib 2.1.1 are frozen default gems of Ruby 3.1.7. omnibus-software patches
  # their code (ruby-3.1-erb-def-method-guard.patch, ruby-3.1-zlib-ungets-buffer.patch), but
  # the gem versions stay the same, so grype still matches them. (reviewed 2026-11-21)
  - vulnerability: GHSA-q339-8rmv-2mhv
    package: { name: erb, version: "2.2.3", type: gem }
  - vulnerability: GHSA-g857-hhfv-j68w
    package: { name: zlib, version: "2.1.1", type: gem }
  # --- nokogiri 1.18.10, three advisories fixed in 1.19.5 (needs Ruby >= 3.2) ---
  # Same reasoning as the nokogiri waivers above: chef never loads nokogiri, nori
  # and aws-sdk-core use only its SAX parser, and inspec's JUnit reporter uses REXML.
  # Drop these when Client 18 moves to Ruby >= 3.2 or reaches EOL. (reviewed 2026-11-21)
  # JRuby only; Client 18 runs CRuby
  - vulnerability: GHSA-v995-44v6-5fqm
    package:
      name: nokogiri
      version: "1.18.10"
      type: gem
  # needs code to serialize untrusted HTML with Nokogiri::HTML5; nothing shipped uses HTML5
  - vulnerability: GHSA-4p39-36wj-23h4
    package:
      name: nokogiri
      version: "1.18.10"
      type: gem
  # needs code to read an attribute's child nodes and then replace its value with Node#[]= or #lang=
  - vulnerability: GHSA-3w22-6jfg-527w
    package:
      name: nokogiri
      version: "1.18.10"
      type: gem
